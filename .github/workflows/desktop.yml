name: Training Studio
on:
  push:
    paths: ['desktop/**', 'desktop_bridge.py', 'coding_loop*.py', 'focused_experiment.py', 'qwen35_*.py', 'repl_learning.py', 'recursive_agent.py', 'training_data.py', 'polyglot_runtime.py', 'teacher_data.py', 'test_*.py', '.github/workflows/desktop.yml']
    tags: ['studio-v*']
  pull_request:
    paths: ['desktop/**', 'desktop_bridge.py', 'coding_loop*.py', 'focused_experiment.py', 'qwen35_*.py', 'repl_learning.py', 'recursive_agent.py', 'training_data.py', 'polyglot_runtime.py', 'teacher_data.py', 'test_*.py', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_desktop_bridge test_focused_report test_focused_experiment test_coding_loop test_qwen35_training test_execution_repair test_loop_recipe test_teacher_data
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish desktop/TrainingStudio/TrainingStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
      - shell: pwsh
        run: |
          $check = Start-Process ./dist/TrainingStudio.exe -ArgumentList '--self-check', 'self-check.txt' -PassThru -Wait
          if ($check.ExitCode -ne 0) { Get-Content self-check.txt; throw 'Native input checks failed' }
          Copy-Item desktop/install.ps1,desktop/README.md,LICENSE dist
          Copy-Item desktop/licenses dist -Recurse
          Remove-Item dist/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive dist/* TrainingStudio-win-x64.zip
          (Get-FileHash TrainingStudio-win-x64.zip -Algorithm SHA256).Hash + '  TrainingStudio-win-x64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TrainingStudio-win-x64
          path: |
            TrainingStudio-win-x64.zip
            SHA256SUMS.txt
